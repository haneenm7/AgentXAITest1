<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>password task</title>
</head>
<body>
    <input type="password" id="passwordInput" placeholder="Enter password">
<i class="fa-solid fa-eye-slash" id="togglePassword"></i>




    <script>
  let passwordInput=document.getElementById("passwordInput");
  let hideandShow=document.getElementById("togglePassword");

    hideandShow.addEventListener("click",function(){
        if(passwordInput.type==="password"){
          
            passwordInput.type="text";
          hideandShow.classList.remove("fa-eye-slash"); 
          hideandShow.classList.add("fa-eye");

        }
        else{
            
            passwordInput.type="password";
          hideandShow.classList.remove("fa-eye");
          hideandShow.classList.add("fa-eye-slash");
        }




    });




    </script>
 </body>

</html>
