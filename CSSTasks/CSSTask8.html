<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Css Task 8</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

h2{
    margin:30px 20px 15px;
}

/* =======================
   Exercise 1 & 2
======================= */

.grid-container{
    display:grid;

    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,120px);

    gap:20px;

    margin:20px;
}

.box{
    background:skyblue;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
}

/* أول عنصر يمتد على عمودين */

.box1{
    grid-column:1 / 3;
}

/* =======================
   Exercise 3
======================= */

.gallery{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));

    gap:20px;

    margin:20px;
}

.gallery img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:10px;
}

</style>

</head>
<body>

<h2>Exercise 1 & 2</h2>

<div class="grid-container">

    <div class="box box1">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>

</div>

<h2>Exercise 3 - Responsive Gallery</h2>

<div class="gallery">

<img src="https://picsum.photos/300?1">
<img src="https://picsum.photos/300?2">
<img src="https://picsum.photos/300?3">
<img src="https://picsum.photos/300?4">
<img src="https://picsum.photos/300?5">
<img src="https://picsum.photos/300?6">
<img src="https://picsum.photos/300?7">
<img src="https://picsum.photos/300?8">

</div>

</body>
</html>
