<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Task 9</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    padding:20px;
}

/* Navbar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.nav-links{
    display:flex;
    gap:20px;
    list-style:none;
}

.nav-links a{
    text-decoration:none;
    color:black;
}

.hamburger{
    display:none;
    font-size:30px;
    cursor:pointer;
}

/* Responsive Title */

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:clamp(24px,5vw,60px);
}

/* Grid */

.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
}

.card{
    background:lightblue;
    padding:40px;
    text-align:center;
    border-radius:10px;
}

/* Tablet */

@media (min-width:768px){

.grid{
    grid-template-columns:repeat(2,1fr);
}

}

/* Desktop */

@media (min-width:1024px){

.grid{
    grid-template-columns:repeat(3,1fr);
}

}

/* Mobile */

@media (max-width:768px){

.nav-links{
    display:none;
}

.hamburger{
    display:block;
}

}

</style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Logo
    </div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="hamburger">
        ☰
    </div>

</nav>

<h1>Responsive Website</h1>

<div class="grid">

    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
    <div class="card">Card 5</div>
    <div class="card">Card 6</div>

</div>

</body>
</html>
