<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>

    <style>
        :root {
            --primary-color: #4bd0e7;
            --secondary-color: #ff6b6b;
            --text-color: #333;
            --bg-color: #f5f5f5;

            --font-size: 16px;

            --padding: 20px;
            --margin: 20px;

            --border-radius: 10px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
            font-family: Arial, sans-serif;
            padding: var(--padding);
        }

        h1 {
            color: var(--primary-color);
        }

        .card {
            background: white;
            padding: var(--padding);
            margin: var(--margin);
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            cursor: pointer;
        }

        .btn:hover {
            background: var(--secondary-color);
        }
    </style>
</head>

<body>

    <h1>CSS Variables Example</h1>

    <div class="card">
        <h2>Card Title</h2>
        <p>This card uses CSS Variables.</p>
        <button class="btn">Click Me</button>

    </div>

</body>

</html>
<script>
    function divide(a, b) {
        try {

            if ( typeof a !== 'number' || typeof b !== 'number') {
                throw new TypeError('يجب ادخال ارقام فقط');
            }
            if (b === 0) {
                throw new Error('لا يمكن القسمة على صفر');
            }
            return a / b;

        }
         catch (error) {
                console.log(error.message);
            }
            return null;

      }
    
console.log(divide(10, 2));  // 5
console.log(divide(10, 0));  // خطأ
console.log(divide(10, "5")); // خطأ
</script>
